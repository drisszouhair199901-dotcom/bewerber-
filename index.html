<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ausbildung Bewerber</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root { --bg:#f3f6f4; --ink:#14221c; --muted:#5b6b64; --card:#ffffff; --accent:#0f6b4f; --line:#d9e2dd; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1714; --ink:#e8f0ec; --muted:#93a39b; --card:#17221e; --accent:#3fbf93; --line:#26362f; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px;
         background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, sans-serif; }
  main { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line);
         border-radius:14px; padding:32px 26px; }
  h1 { font-size:1.6rem; margin:0 0 8px; line-height:1.2; }
  p { color:var(--muted); margin:0 0 22px; }
  button { width:100%; padding:13px 16px; border-radius:10px; border:1px solid var(--line);
           background:var(--ink); color:var(--bg); font:600 1rem system-ui, sans-serif; cursor:pointer; }
  button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  button.ghost { background:transparent; color:var(--ink); margin-top:10px; }
  .user { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .user img { width:44px; height:44px; border-radius:50%; }
  .user b { display:block; } .user span { color:var(--muted); font-size:.9rem; word-break:break-all; }
  .note { font-size:.85rem; margin-top:16px; }
  .err { color:#c0392b; margin-top:12px; font-size:.9rem; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <section id="out">
    <h1>Bewirb dich auf viele Ausbildungsplätze gleichzeitig.</h1>
    <p>Melde dich mit Google an. Deine Bewerbungen werden von deinem eigenen Gmail-Konto gesendet. Wir können deine E-Mails nicht lesen.</p>
    <button id="login">Mit Google anmelden</button>
    <div class="err" id="err" hidden></div>
  </section>

  <section id="in" hidden>
    <div class="user">
      <img id="avatar" alt="" referrerpolicy="no-referrer">
      <div><b id="name"></b><span id="email"></span></div>
    </div>
    <p id="gmailState"></p>
    <button class="ghost" id="logout">Abmelden</button>
  </section>
</main>

<script>
  // ====== 1) HIER DEINE WERTE EINTRAGEN (Supabase → Project Settings → API) ======
  const SUPABASE_URL = "https://obmqvalclexmfstkwkih.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_Mcq6NZ1DqiJTNaeRmYDFrg_5WPy79Zi"; // anon key ist öffentlich, kein Secret
  // ===============================================================================

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const $ = (id) => document.getElementById(id);

  $("login").onclick = async () => {
    const { error } = await sb.auth.signInWithOAuth({
      provider: "google",
      options: {
        redirectTo: window.location.origin,
        scopes: "https://www.googleapis.com/auth/gmail.send email profile",
        queryParams: { access_type: "offline", prompt: "consent" }
      }
    });
    if (error) { $("err").textContent = error.message; $("err").hidden = false; }
  };

  $("logout").onclick = async () => { await sb.auth.signOut(); render(null); };

  function render(session) {
    $("out").hidden = !!session;
    $("in").hidden = !session;
    if (!session) return;
    const m = session.user.user_metadata || {};
    $("name").textContent = m.full_name || m.name || "";
    $("email").textContent = session.user.email;
    if (m.avatar_url) $("avatar").src = m.avatar_url;
    $("gmailState").textContent = session.provider_token
      ? "Gmail-Zugriff erteilt. Du kannst jetzt Bewerbungen senden."
      : "Angemeldet. Melde dich neu an, um den Gmail-Zugriff zu erteilen.";
  }

  sb.auth.onAuthStateChange((event, session) => {
    // provider_refresh_token ist nur direkt nach dem Login verfügbar.
    // Im nächsten Schritt speichern wir ihn serverseitig (Supabase-Tabelle).
    render(session);
  });
  sb.auth.getSession().then(({ data }) => render(data.session));
</script>
</body>
</html>
